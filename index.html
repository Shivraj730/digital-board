<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">

    <!-- TV / Digital Board responsive viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ब्याँस गाउँपालिका डिजिटल सूचना पाटी</title>

    <!--
        CSS FILE
        यो file पछि:
        style.css
        मा राख्ने हो।
    -->
       <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================================================
         1. HEADER
         ========================================================= -->
   <div id= "board" class="board"> 
	<header class="board-header">

    <!-- LOGO -->
    <div class="logo-box">
        <img
            src="https://raw.githubusercontent.com/Shivraj730/digital-board/main/logo.png"
            alt="ब्याँस गाउँपालिका लोगो"
        >
    </div>


    <!-- CENTER TITLE -->
    <div class="header-title">
        <h2>ब्याँस गाउँपालिका</h2>
        <h1>गाउँकार्यपालिकाको कार्यालय</h1>
        <h3>सुन्सेरा, दार्चुला</h3>
    </div>


    <!-- NEPAL FLAG -->
    <div class="nepal-flag-box">

        <svg
            class="nepal-flag"
            viewBox="0 0 180 230"
            xmlns="http://www.w3.org/2000/svg"
            aria-label="नेपालको राष्ट्रिय झण्डा"
        >

            <!-- Flag shape -->
            <path
                class="flag-cloth"
                d="M15 10
                   L125 75
                   L55 75
                   L145 135
                   L55 135
                   L15 215
                   Z"
            />

            <!-- Moon -->
            <path
                class="flag-moon"
                d="M55 48
                   A25 25 0 1 0 55 82
                   A19 19 0 1 1 55 48
                   Z"
            />

            <!-- Sun -->
            <circle
                class="flag-sun"
                cx="72"
                cy="120"
                r="15"
            />

            <!-- Sun rays -->
            <g class="flag-rays">
                <line x1="72" y1="98" x2="72" y2="92"/>
                <line x1="72" y1="142" x2="72" y2="148"/>
                <line x1="50" y1="120" x2="44" y2="120"/>
                <line x1="94" y1="120" x2="100" y2="120"/>
                <line x1="57" y1="105" x2="53" y2="101"/>
                <line x1="87" y1="135" x2="91" y2="139"/>
                <line x1="87" y1="105" x2="91" y2="101"/>
                <line x1="57" y1="135" x2="53" y2="139"/>
            </g>

        </svg>

    </div>

</header>

    <!-- =========================================================
         2. NEWS TICKER
         ========================================================= -->
    <section class="ticker-section">

        <div class="ticker-label">
            सूचना तथा समाचार
        </div>

        <div class="ticker-window">
            <div id="newsTicker" class="ticker-content">
                सूचना तथा समाचारहरू लोड हुँदैछ...
            </div>
        </div>

    </section>


    <!-- =========================================================
         3. MAIN CONTENT
         तलको भाग २ वटा column मा विभाजन गरिएको छ।
         ========================================================= -->
    <main class="main-content">

        <!-- =====================================================
             LEFT COLUMN
             Notice Image Slideshow
             ===================================================== -->
        <section class="notice-section">

            <div class="section-title">
                सूचना
            </div>

            <div id="noticeSlider" class="notice-slider">

                <div class="loading">
                    सूचना लोड हुँदैछ...
                </div>

            </div>

        </section>


        <!-- =====================================================
             RIGHT COLUMN
             जनप्रतिनिधि + कर्मचारी + फोटो ग्यालरी
             ===================================================== -->
        <section class="right-column">


            <!-- =================================================
                 4. ELECTED OFFICIALS
                 ================================================= -->
            <section class="officials-section">

                <div class="section-title">
                    जनप्रतिनिधि विवरण
                </div>

                <div id="electedOfficials" class="officials-container">

                    <div class="loading">
                        जनप्रतिनिधि विवरण लोड हुँदैछ...
                    </div>

                </div>

            </section>


            <!-- =================================================
                 5. STAFF SLIDESHOW
                 ================================================= -->
            <section class="staff-section">

                <div class="section-title">
                    कर्मचारी विवरण
                </div>

                <div id="staffSlider" class="staff-slider">

                    <div class="loading">
                        कर्मचारी विवरण लोड हुँदैछ...
                    </div>

                </div>

            </section>


            <!-- =================================================
                 6. PHOTO GALLERY
                 ================================================= -->
            <section class="gallery-section">

                <div class="section-title">
                    फोटो ग्यालरी
                </div>

                <div id="photoGallery" class="gallery-slider">

                    <div class="loading">
                        फोटो ग्यालरी लोड हुँदैछ...
                    </div>

                </div>

            </section>

        </section>

    </main>
	
	</div>

	<script>
    function fitDigitalBoard() {
        const board = document.getElementById("board");

        if (!board) {
            return;
        }

        const MASTER_WIDTH = 1920;
        const MASTER_HEIGHT = 1080;

        const scaleX =
            window.innerWidth / MASTER_WIDTH;

        const scaleY =
            window.innerHeight / MASTER_HEIGHT;

        board.style.setProperty(
            "--board-scale-x",
            scaleX
        );

        board.style.setProperty(
            "--board-scale-y",
            scaleY
        );
    }

    window.addEventListener(
        "resize",
        fitDigitalBoard
    );

    window.addEventListener(
        "orientationchange",
        fitDigitalBoard
    );

    fitDigitalBoard();
</script>
    <!-- =========================================================
         JAVASCRIPT FILE

         सबै Drupal API URL र Digital Board को logic
         app.js मा राखिनेछ।
         ========================================================= -->
   <script src="offline-cache.js"></script>
   <script src="app.js"></script>
</body>
</html>
